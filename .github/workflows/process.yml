name: Process public retinal data
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Job type
        type: choice
        options: [refresh, analysis]
        default: refresh
      job_id:
        description: Analysis request identifier
        type: string
        default: ''
      target:
        description: Optional source to retry
        type: string
        default: ''
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: retina-${{ inputs.kind || 'refresh' }}-${{ inputs.job_id || 'sources' }}
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      JOB_KIND: ${{ inputs.kind || 'refresh' }}
      JOB_ID: ${{ inputs.job_id }}
      RETRY_SOURCE: ${{ inputs.target }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Prepare temporary runner storage
        if: ${{ inputs.kind != 'analysis' }}
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - run: pip install -r backend/requirements.txt
      - name: Retrieve and process public data
        run: python backend/worker.py
      - name: Record interrupted source checks
        if: ${{ failure() && inputs.kind != 'analysis' }}
        run: |
          python - <<'PYCODE'
          import sys,time
          sys.path.insert(0,'backend')
          from release_data import read_state,write_state
          c=read_state('state/catalog.json')
          c['freshness'].update(status='failed',message='The source-check runner stopped. Completed datasets remain available. A later visit or scheduled check can retry.',updatedAt=time.time())
          write_state('state/catalog.json',c)
          PYCODE
